# Grafana contact point: the local webhook receiver (service "alert-receiver").
# Every delivery (firing and resolved) is recorded at http://localhost:9095/
apiVersion: 1

contactPoints:
  - orgId: 1
    name: local-webhook-receiver
    receivers:
      - uid: local-webhook-receiver
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://alert-receiver:9095/grafana-webhook
          httpMethod: POST
