name: CI - Train and Ship Credit Scoring Model

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.10"
  PROJECT_DIR: MLProject
  DATA_DIR: MLProject/namadataset_preprocessing
  TARGET_COLUMN: credit_risk
  MLFLOW_EXPERIMENT_NAME: Credit Scoring - CI
  IMAGE_NAME: credit-scoring-model
  WORK_DIR: ci-out/work
  RELEASE_DIR: ci-out/release
  SERVING_PORT: "5005"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  train-and-ship:
    name: Train, release and publish model image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            MLProject/conda.yaml
            ci/requirements.txt

      - name: Check Env
        env:
          DOCKERHUB_TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "Python : $(python --version 2>&1) ($(command -v python))"
          echo "Docker : $(docker --version)"
          echo "Commit : ${GITHUB_SHA} (${GITHUB_EVENT_NAME} on ${GITHUB_REF_NAME})"
          for split in train test; do
            file="${DATA_DIR}/${split}.csv"
            if [[ ! -s "${file}" ]]; then
              echo "::error file=${file}::Preprocessed ${split} split is missing or empty."
              exit 1
            fi
            if ! head -n 1 "${file}" | tr ',' '\n' | grep -qx "${TARGET_COLUMN}"; then
              echo "::error file=${file}::Target column '${TARGET_COLUMN}' not found in the header."
              exit 1
            fi
            echo "Data   : ${file} ($(( $(wc -l < "${file}") - 1 )) rows)"
          done
          if [[ -z "${DOCKERHUB_USERNAME}" || "${DOCKERHUB_TOKEN_SET}" != "true" ]]; then
            echo "::error::Repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must both be set."
            exit 1
          fi
          if [[ ! "${DOCKERHUB_USERNAME}" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::DOCKERHUB_USERNAME must be the lowercase Docker Hub namespace."
            exit 1
          fi
          echo "IMAGE_REPOSITORY=docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: |
          python -m pip install -r ci/requirements.txt
          python ci/export_pip_requirements.py "${PROJECT_DIR}/conda.yaml" \
            --output "${RUNNER_TEMP}/project-requirements.txt"
          python -m pip install -r "${RUNNER_TEMP}/project-requirements.txt"
          python -m pip check
          mlflow --version

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=file://${RUNNER_TEMP}/mlruns" >> "${GITHUB_ENV}"

      - name: Run mlflow project
        run: |
          mlflow run "${PROJECT_DIR}" --env-manager=local \
            --experiment-name "${MLFLOW_EXPERIMENT_NAME}" \
            --run-name "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Get latest MLflow run_id
        id: run
        run: |
          python ci/resolve_run.py --experiment-name "${MLFLOW_EXPERIMENT_NAME}" \
            --commit-sha "${GITHUB_SHA}" --output "${WORK_DIR}/run.json"

      - name: Verify logged model
        env:
          MODEL_URI: ${{ steps.run.outputs.model_uri }}
        run: |
          python ci/verify_model.py --model-uri "${MODEL_URI}" \
            --data "${DATA_DIR}/test.csv" --target "${TARGET_COLUMN}" \
            --report "${WORK_DIR}/verification.json"

      - name: Install Python dependencies
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          MODEL_PATH: ${{ steps.run.outputs.model_artifact_path }}
        run: |
          # Isolated env built only from the logged model's own requirements.txt,
          # so the published artifact is checked independently of the training env.
          mkdir -p "${WORK_DIR}/download"
          mlflow artifacts download --run-id "${RUN_ID}" --artifact-path "${MODEL_PATH}" \
            --dst-path "${WORK_DIR}/download"
          python -m venv "${WORK_DIR}/model-env"
          "${WORK_DIR}/model-env/bin/python" -m pip install \
            -r "${WORK_DIR}/download/${MODEL_PATH}/requirements.txt"
          "${WORK_DIR}/model-env/bin/python" -m pip check

      - name: Package model artifacts
        id: package
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          MODEL_PATH: ${{ steps.run.outputs.model_artifact_path }}
        run: |
          version="${GITHUB_SHA::7}-${RUN_ID::12}"
          release_tag="model-${version}"
          archive="${RELEASE_DIR}/${IMAGE_NAME}-${version}.tar.gz"
          mkdir -p "${RELEASE_DIR}"
          tar -C "${WORK_DIR}/download" -czf "${archive}" "${MODEL_PATH}"

          # Load the archive exactly as it will be published, in the isolated env.
          mkdir -p "${WORK_DIR}/extracted"
          tar -C "${WORK_DIR}/extracted" -xzf "${archive}"
          "${WORK_DIR}/model-env/bin/python" ci/verify_model.py \
            --model-uri "${WORK_DIR}/extracted/${MODEL_PATH}" \
            --data "${DATA_DIR}/test.csv" --target "${TARGET_COLUMN}"

          python ci/write_manifest.py create \
            --run-facts "${WORK_DIR}/run.json" --verification "${WORK_DIR}/verification.json" \
            --model-archive "${archive}" --release-tag "${release_tag}" \
            --image-repository "${IMAGE_REPOSITORY}" --image-tag "${version}" --image-tag latest \
            --output "${RELEASE_DIR}/manifest.json"
          (cd "${RELEASE_DIR}" && sha256sum -- *.tar.gz manifest.json > SHA256SUMS)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Upload to GitHub
        id: draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          # Draft until the Docker image is pushed; published in "Publish GitHub Release".
          notes="${WORK_DIR}/release-notes.md"
          {
            echo "Trained by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} from commit ${GITHUB_SHA}."
            echo
            echo "- MLflow run ID: \`${RUN_ID}\`"
            echo "- Model archive: MLmodel, model.pkl, conda.yaml, python_env.yaml, requirements.txt"
            echo "- \`manifest.json\`: run ID, metrics, commit, workflow run, image digest"
          } > "${notes}"
          gh release create "${RELEASE_TAG}" --draft --target "${GITHUB_SHA}" \
            --title "Credit scoring model ${RELEASE_TAG}" --notes-file "${notes}" \
            "${RELEASE_DIR}"/*.tar.gz "${RELEASE_DIR}/manifest.json" "${RELEASE_DIR}/SHA256SUMS"

      - name: Build Docker Model
        env:
          MODEL_URI: ${{ steps.run.outputs.model_uri }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          mlflow models build-docker --model-uri "${MODEL_URI}" \
            --name "${IMAGE_NAME}:${VERSION}" --env-manager local
          docker image inspect "${IMAGE_NAME}:${VERSION}" --format 'Built {{.Id}} ({{.Size}} bytes)'

      - name: Smoke-test Docker image
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          container="$(docker run -d -p "127.0.0.1:${SERVING_PORT}:8080" "${IMAGE_NAME}:${VERSION}")"
          cleanup() {
            local status=$?
            docker logs "${container}" > "${WORK_DIR}/container.log" 2>&1 || echo "::warning::Could not read container logs."
            if [[ ${status} -ne 0 ]]; then
              echo "::group::Container logs"; tail -n 100 "${WORK_DIR}/container.log"; echo "::endgroup::"
            fi
            docker rm -f "${container}" > /dev/null
          }
          trap cleanup EXIT
          python ci/smoke_test_serving.py --url "http://127.0.0.1:${SERVING_PORT}" \
            --data "${DATA_DIR}/test.csv" --target "${TARGET_COLUMN}"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "${DOCKERHUB_TOKEN}" | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Tag Docker Image
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          docker tag "${IMAGE_NAME}:${VERSION}" "${IMAGE_REPOSITORY}:${VERSION}"
          docker tag "${IMAGE_NAME}:${VERSION}" "${IMAGE_REPOSITORY}:latest"

      - name: Push Docker Image
        id: push
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          docker push "${IMAGE_REPOSITORY}:${VERSION}"
          docker push "${IMAGE_REPOSITORY}:latest"
          # Read both tags back from the registry; they must resolve to the same digest.
          registry_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' \
              | python -c 'import json, sys; print(json.load(sys.stdin)["digest"])'
          }
          digest="$(registry_digest "${IMAGE_REPOSITORY}:${VERSION}")"
          latest_digest="$(registry_digest "${IMAGE_REPOSITORY}:latest")"
          if [[ "${digest}" != "${latest_digest}" ]]; then
            echo "::error::Registry digests differ: ${VERSION}=${digest}, latest=${latest_digest}."
            exit 1
          fi
          echo "Pushed ${IMAGE_REPOSITORY}:${VERSION} (${digest})"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          VERSION: ${{ steps.package.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          python ci/write_manifest.py record-image --manifest "${RELEASE_DIR}/manifest.json" --digest "${DIGEST}"
          (cd "${RELEASE_DIR}" && sha256sum -- *.tar.gz manifest.json > SHA256SUMS)
          gh release upload "${RELEASE_TAG}" "${RELEASE_DIR}/manifest.json" "${RELEASE_DIR}/SHA256SUMS" --clobber
          gh release edit "${RELEASE_TAG}" --draft=false --latest
          release="$(gh release view "${RELEASE_TAG}" --json isDraft,url,assets)"
          if ! jq -e '(.isDraft | not) and ([.assets[].name] | length == 3)' <<< "${release}" > /dev/null; then
            echo "::error::Release ${RELEASE_TAG} is not published with its 3 assets: ${release}"
            exit 1
          fi
          {
            echo "### Model shipped"
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| MLflow run ID | \`${RUN_ID}\` |"
            echo "| GitHub Release | $(jq -r .url <<< "${release}") |"
            echo "| Docker image | \`${IMAGE_REPOSITORY}:${VERSION}\` |"
            echo "| Image digest | \`${DIGEST}\` |"
            echo "| Docker Hub page | https://hub.docker.com/r/${DOCKERHUB_USERNAME}/${IMAGE_NAME} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Discard draft release after failure
        if: failure() && steps.draft_release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes
          echo "::warning::Deleted release ${RELEASE_TAG} because a later step failed."

      - name: Log out of Docker Hub
        if: always()
        run: docker logout docker.io

      - name: Upload CI outputs (convenience copy)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/release/
            ci-out/work/*.json
            ci-out/work/container.log
          if-no-files-found: ignore
          retention-days: 14
