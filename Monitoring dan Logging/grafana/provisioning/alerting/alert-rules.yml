# GENERATED by `python -m monitoring_app.prepare` from monitoring_app/alerting.py - do not edit by hand.
apiVersion: 1
groups:
- orgId: 1
  name: model-serving
  folder: Credit Scoring Alerts
  interval: 15s
  rules:
  - uid: model-serving-unavailable
    title: Model or serving path unavailable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus-local
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus-local
        editorMode: code
        expr: (max(model_ready{job="inference-gateway"}) or on() vector(0)) * (max(up{job="inference-gateway"}) or on() vector(0)) * (max(up{job="model-server"}) or on() vector(0))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
        legendFormat: __auto
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        reducer: last
        settings:
          mode: dropNN
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: B
        intervalMs: 1000
        maxDataPoints: 43200
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: Alerting
    execErrState: Alerting
    for: 30s
    isPaused: false
    annotations:
      summary: The model server is not ready or a required exporter is down.
      description: 'Health product = {{ $values.B.Value }} (1 = healthy). Inputs: model_ready (gateway probe of /ping), up{job=inference-gateway}, up{job=model-server}.'
      troubleshooting: docker compose ps; docker compose logs --tail=50 model-server inference-gateway; check http://localhost:8000/readyz and Prometheus Status > Targets.
      __dashboardUid__: credit-scoring-monitoring
      __panelId__: '7'
    labels:
      severity: critical
      service: credit-scoring-model
  - uid: high-inference-latency
    title: High inference latency (p95)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus-local
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus-local
        editorMode: code
        expr: histogram_quantile(0.95, sum by (le) (rate(inference_duration_seconds_bucket{job="inference-gateway", outcome="success"}[2m]))) and on() (sum(increase(inference_requests_total{job="inference-gateway", outcome="success"}[2m])) >= 20)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
        legendFormat: __auto
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        reducer: last
        settings:
          mode: dropNN
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: B
        intervalMs: 1000
        maxDataPoints: 43200
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0.5
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 1m
    isPaused: false
    annotations:
      summary: p95 latency of successful inferences above 0.5 s for 1 minute.
      description: p95 over the last 2m = {{ humanizeDuration $values.B.Value }} with at least 20 successful requests in the window.
      troubleshooting: Check panels 3 (in-flight) and 8 (CPU) for saturation; reduce batch size/concurrency or raise MODEL_SERVER_WORKERS; inspect slow requests in the gateway log (duration_ms).
      __dashboardUid__: credit-scoring-monitoring
      __panelId__: '2'
    labels:
      severity: warning
      service: credit-scoring-model
  - uid: high-inference-failure-rate
    title: High inference failure rate
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus-local
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus-local
        editorMode: code
        expr: (sum(increase(inference_requests_total{job="inference-gateway", outcome=~"gateway_error|model_error|timeout|unavailable"}[2m])) / sum(increase(inference_requests_total{job="inference-gateway", outcome!="invalid_input"}[2m]))) and on() (sum(increase(inference_requests_total{job="inference-gateway", outcome!="invalid_input"}[2m])) >= 20)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
        legendFormat: __auto
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        reducer: last
        settings:
          mode: dropNN
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: B
        intervalMs: 1000
        maxDataPoints: 43200
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0.1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 1m
    isPaused: false
    annotations:
      summary: More than 10% of valid inference requests failed server-side for 1 minute.
      description: Failure ratio over the last 2m = {{ humanizePercentage $values.B.Value }} (outcomes gateway_error|model_error|timeout|unavailable; minimum 20 valid requests).
      troubleshooting: Filter the gateway log by level=ERROR and read error_category/error_detail; check model-server logs; confirm FAULT_INJECTION_ENABLED=false outside controlled tests.
      __dashboardUid__: credit-scoring-monitoring
      __panelId__: '1'
    labels:
      severity: critical
      service: credit-scoring-model
