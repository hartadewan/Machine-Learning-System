global:
  scrape_interval: 5s      
  scrape_timeout: 4s
  evaluation_interval: 15s

scrape_configs:
  - job_name: inference-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["inference-gateway:8000"]
        labels:
          component: gateway

  - job_name: model-server
    metrics_path: /metrics
    static_configs:
      - targets: ["model-server:9101"]
        labels:
          component: model-server-supervisor

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
